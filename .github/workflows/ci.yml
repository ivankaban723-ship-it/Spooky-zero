name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build Rust emulator
        run: cargo build --release --manifest-path emulator/Cargo.toml
      - name: Build Zlang compiler
        run: cd compiler && go build -o zlangc .
      - name: Run tests
        run: python3 tests/run_tests.py
